# 个人投资平台配置
database: data/quant.db
history_start: "2015-01-01"

backtest:
  cost_bps: 5           # 单边交易成本（基点，万5），戳破零成本换仓的虚高

# 关注列表（按组划分，策略通过 groups 指定作用范围）
watchlist:
  broad:                # 大盘 ETF
    - SPY
    - QQQ
    - IWM
    - DIA
  sectors:              # 行业 ETF（动量轮动宇宙）
    - XLK
    - XLV
    - XLF
    - XLY
    - XLP
    - XLE
    - XLI
    - XLB
    - XLU
    - XLRE
    - XLC
  themes:               # 热门主题 ETF
    - SMH               # 半导体（含美光等 DRAM/存储厂商）
    - SOXX              # 半导体
    - IGV               # 软件
  assets:               # 资产类 ETF
    - TLT               # 长期国债
    - GLD               # 黄金
    - IBIT              # 比特币
  cash:                 # 现金等价物（防御策略的"持现金"兜底 → 改持短债吃无风险利率）
    - BIL               # 1-3月短债 ETF（近零波动、零久期；2007+全历史，= SGOV 的长历史版）
  canary:               # 哨兵资产（Keller DAA/HAA 的 canary universe）：只当风险开关，不持有
    - TIP               # 抗通胀国债（HAA 用的单哨兵：通胀/实际利率的早期预警）
  defense:              # 防守腿（哨兵触发时持有，与 cash 组的 BIL 一起选动量最高的）
    - IEF               # 7-10 年中期国债（久期短于 TLT，2022 型加息熊市里没那么惨）
  # ── 以下三组仅拉数据/展示与未来跨资产用，组名未被任何策略 groups 引用 → 不喂给现有策略 ──
  # （加入前用日收益相关性筛过：只留与现有池低相关=真加信息的，冗余的如 VGT/VNQ/XSD/XOP 已剔）
  cross_asset:          # 跨资产分散（跨资产动量的原料，backlog #6）
    - DBC               # 广谱商品（与现有池相关最低 r≈0.62）
    - VWO               # 新兴市场（r≈0.69）
    - VEA               # 发达市场（美国以外，r≈0.77）
    - HYG               # 高收益信用债（r≈0.75）
  cross_asset_mom_universe:  # 跨资产动量轮动宇宙（9类低相关资产）
    - SPY               # 美股大盘
    - QQQ               # 纳指100
    - VEA               # 发达市场（美国以外）
    - VWO               # 新兴市场
    - TLT               # 长期国债
    - HYG               # 高收益信用债
    - GLD               # 黄金
    - DBC               # 广谱商品
    - XLRE              # REITs
  sub_themes:           # 细分主题（独立于宽科技的子周期）
    - DRAM              # 存储/内存（Roundhill；与宽半导体 r≈0.87，最分化的半导体子行业；历史仅约3月）
    - XBI               # 生物科技（等权，特质性强 r≈0.70）
  factor_bench:         # 因子基准 ETF（不图分散，图对标自制因子）
    - RSP               # 标普500等权（= 我们手算的等权基准）
    - USMV              # 最小波动（low_vol 的官方对标）
    - MTUM              # 动量因子
  watch_only:           # 仅观察/攒历史：候选避险资产，历史太短暂不接进任何策略
    - DBMF               # 托管期货趋势跟踪（与股债低相关，通胀型熊市有潜力），2019-05 才上市
                          # 仅约7年历史+只经历过一次真正的通胀熊市(2022)，先攒数据，够长再评估
  aggressive_growth:    # 进攻档宇宙：成长/科技 ETF（进攻）+ TLT（避险）
    - QQQ               # 纳指100
    - XLK               # 科技
    - SMH               # 半导体
    - IGV               # 软件
    - XLY               # 可选消费
    - XBI               # 生物科技
    - TLT               # 长债（现金感知避险，非进攻）
  volatility:           # 波动率指数（不可交易，用于情绪/风险信号）
    - ^VIX              # 恐慌指数
    - ^VIX3M            # 三个月期 VIX
  macro:                # 宏观指数与资产（纯展示，不喂给任何策略）
    - ^GSPC              # 标普500指数
    - ^IXIC              # 纳斯达克综合指数
    - ^DJI                # 道琼斯工业指数
    - ^RUT                # 罗素2000指数
    - ^TNX                # 10年期美债收益率
    - ^IRX                # 3个月期美债收益率
    - DX-Y.NYB            # 美元指数
    - GC=F                # 黄金期货
    - CL=F                # 原油 WTI 期货
    - BTC-USD             # 比特币

strategies:
  sma_cross:
    enabled: true
    notify: false          # 仅观察：信号入库但不发邮件/推送
    fast: 20
    slow: 60
    groups: [broad, themes, assets]
  momentum:               # 行业 12-1 月度动量轮动：旧版（63日/每日进出）whipsaw 严重，
    enabled: true         # 短期反转频繁买在山顶，实测跑输板块等权；改为 12-1 月度拿得更稳
    lookback_days: 252    # 动量回看约 12 个月
    skip_days: 21         # 跳过最近约 1 个月（12-1 口径，避开短期反转买在山顶）
    top_n: 3
    groups: [sectors]
  rsi_reversal:
    enabled: true
    notify: false          # 仅观察：信号入库但不发邮件/推送
    period: 14
    oversold: 30
    overbought: 70
    groups: [broad, sectors, themes, assets]
  smart_dca:              # 定投+信号开关：死叉暂停积攒，金叉恢复补投
    enabled: true
    symbol: SPY
    fast: 20
    slow: 60
    groups: [broad]
  dual_momentum:          # GEM 双动量：动量转负切避险(现金感知，避险也负则持现金)
    enabled: true
    lookback_days: 252    # 约 12 个月
    risk_assets: [SPY, QQQ]
    safe_asset: TLT
    cash_asset: BIL       # 风险与避险动量全负时，持 BIL 吃短债利率（替代 0% 现金）
    groups: [broad, assets, cash]
  vix_regime:             # VIX 情绪/风险提醒：恐慌区、自满区、期限倒挂
    enabled: true
    notify: false          # 仅观察：信号入库但不发邮件/推送
    vix: ^VIX
    vix3m: ^VIX3M
    panic: 30             # 恐慌阈值
    complacency: 15       # 自满阈值
    trade_symbol: SPY     # 回测时把提醒映射到该标的执行
    groups: [volatility]
  stock_momentum:         # 个股横截面动量：动态流动性池 + 12-1 动量 + 大盘过滤
    enabled: true
    notify: false          # 仅观察：信号入库但不发邮件/推送
    universe_file: universe_sp500.yaml
    pool_size: 100        # 每月按成交额取前 N 构成选股池（point-in-time）
    liquidity_window: 20  # 成交额排名窗口（日）
    lookback_days: 252    # 动量回看约 12 个月
    skip_days: 21         # 跳过最近 1 个月（12-1 口径，避开短期反转）
    top_n: 6              # 持有动量最强的前 N 只
    max_per_sector: 2     # 单行业上限
    regime_symbol: SPY
    regime_ma: 200        # 大盘跌破 200 日均线 → 整体切避险
    safe_asset: TLT
    groups: [broad, assets]
  low_vol:                  # 低波动因子：一篮子 ETF 中波动最低的前 N 只，首个非动量分散因子
    enabled: true
    lookback_days: 90       # 波动率回看窗口（日），约 4 个月
    top_n: 3                # 持有波动最低的前 N 只
    groups: [sectors, assets]  # 行业 ETF + 资产类（含 TLT 长债/GLD 黄金）：
                            # 扩宇宙让低波动能选到非股票资产，降低与动量家族的相关性
                            # （sectors-only 时因同为长多股票、共享市场beta，相关仍约0.5）
  cross_asset_mom:            # 跨资产 12-1 月度动量轮动 + 绝对动量开关（稳健档）
    enabled: true             # 【2026-07-27 修正】原称"首个跑赢公平基准"，经调仓日
                              # timing luck 检验后该说法不成立，详见 cross_asset.py 文档头
    lookback_days: 252        # 动量回看约 12 个月（与 momentum/stock_momentum 一致）
    skip_days: 21             # 跳过最近约 1 个月（12-1 口径，避开短期反转）
    top_n: 3                  # 每月持有动量最强的前 3 类资产
    abs_momentum: true        # 绝对动量开关：动量为负不买入持现金（熊市保险）
    groups: [cross_asset_mom_universe]  # 9 类低相关资产宇宙
                              # 【不接 BIL 现金等价】：top3 空槽是零散的 1/3、2/3，等权引擎
                              # 无法干净表示；且整仓换仓日会把钱集中到不足 3 个的正动量赢家上
                              # （各 50% 而非文档说的"空槽持现金"），+237% 有一部分来自这个
                              # 计划外集中。加 BIL 只是部分修正反把数字降到 +200%，故不接。
                              # 实测 top3+abs（月首日调仓）：+234%/夏普0.80/回撤-21.5%/Calmar0.51
                              # 等权全资产基准：+171%/夏普0.81/Calmar0.39 —— 夏普只是打平；
                              # 且月首日是四个调仓日里最好的一个（错峰组合 +162%/0.66/0.33
                              # 三项全输基准），timing luck 年化跨度 569bp，全平台最脆弱
  aggressive_mom:             # 进攻档：成长 ETF 集中 12-1 动量 + 现金感知避险
    enabled: true             # 目标够 QQQ 增长同时控回撤
    lookback_days: 252        # 动量回看约 12 个月
    skip_days: 21             # 跳过最近约 1 个月（12-1 口径）
    top_n: 1                  # 集中持有动量最强的 1 只成长 ETF
    safe_assets: [TLT]        # 现金感知避险：成长转负切正动量避险，避险也负则持现金
    cash_asset: BIL           # 成长与避险动量全负时，持 BIL 吃短债利率（替代 0% 现金）
    groups: [aggressive_growth, cash]  # 成长/科技 ETF + TLT 避险 + 现金等价
                              # 实测 top1（月首日）：+737%/年化20.2%/回撤-34.3%/夏普0.81/Calmar0.59
                              # 去 timing luck 的错峰口径 +717%/20.0%/-33.1%/0.81/0.60（几乎不变=最稳）
                              # 【2026-07-27 公平基准补测】跑赢 QQQ 属实但 QQQ 非公平基准；
                              # 对★成长池等权(+606%/夏普0.85/Calmar0.49)全历史赢收益/回撤/Calmar
                              # 但输夏普，且 walk-forward 分裂：2015-2020 三项都输、超额只在 2021-2026
                              # → "排名加了信息"未被证明，站得住的是集中押注+避险腿。详见 aggressive.py
                              # 诚实：集中成长押注，成长失宠会落后，比 cross_asset_mom 波动大
  canary_mom:                 # 哨兵动量：把「何时防守」与「持什么」拆开（Keller DAA/HAA 架构）
    enabled: true
    notify: false             # 仅观察：新策略，先攒实盘信号再考虑推送（理由见 canary.py 诚实边界）
    lookback_days: 252        # 选择层（慢）：12-1 动量，与平台其它策略一致
    skip_days: 21
    top_n: 3                  # 与 cross_asset_mom 同宇宙同 top_n，便于 A/B
    canary_assets: [TIP]      # 触发层（快）：13612W 哨兵，任一为负 → 全体风险关闭
    defense_assets: [IEF, BIL]  # 风险关闭时持动量最高的防守腿
    cash_asset: BIL
    abs_momentum: false       # 不叠加自指的绝对动量过滤——实测叠上去反而变差（见下）
    groups: [cross_asset_mom_universe, canary, defense, cash]
                              # 实测（错峰口径，全历史）：+208%/年化10.2%/回撤-19.8%/夏普0.97/Calmar0.52
                              # vs ★进攻池等权 +171%/9.0%/-23.0%/0.81/0.39 → 超额+1.2%/夏普+0.15/回撤好3.3pt
                              # **walk-forward 两段都赢三项**（超额+1.1%/+0.7%，夏普+0.21/+0.07）
                              # = 平台上第一个两段都跑赢自己公平基准的策略。timing luck 跨度 194bp（中等）
                              # A/B：叠加自指绝对动量（HAA 原版双保险）反而变差（超额-0.8%/夏普-0.08）；
                              # 现有 cross_asset_mom 的自指开关两段超额均为负（-1.8%/-1.8%）

notify:
  telegram: true        # 需在 .env 配置 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  email: true           # 需在 .env 配置 SMTP_HOST / SMTP_USER / SMTP_PASSWORD / EMAIL_TO
